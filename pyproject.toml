[build-system]
requires = ["scikit-build-core>=0.8", "swig>=4.0"]
build-backend = "scikit_build_core.build"

[project]
name = "oeio"
version = "0.6.0"
description = "Modular package for deploying new readers and writers for the OpenEye Toolkits"
license = "MIT"
license-files = ["LICENSE"]
# The floor is set by openeye-toolkits, not by anything in this package: 2026.1
# is the first release with py314 wheels and the first to drop py310, and the
# extension links its OpenEye shared libraries by versioned soname, so the
# runtime toolkit has to be the one the wheel was built against.
requires-python = ">=3.11"
authors = [
    { name = "Scott Johnson", email = "scott.arne.johnson@gmail.com" },
]
keywords = ["chemistry", "openeye", "swig"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
]
dependencies = [
    "openeye-toolkits>=2026.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "vrzn>=0.1.0"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.scikit-build]
cmake.version = ">=3.21"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
build.targets = ["oeio_python"]
wheel.install-dir = "."
logging.level = "INFO"
strict-config = false
wheel.py-api = "cp310"
wheel.exclude = ["**.pyc", "**/__pycache__", "*.a", "CMakeFiles/**"]

[tool.scikit-build.cmake.define]
OEIO_BUILD_TESTS = "OFF"
OEIO_BUILD_PYTHON = "ON"
OPENEYE_USE_SHARED = "ON"
OEIO_USE_STABLE_ABI = "ON"
OEIO_UNIVERSAL2 = "OFF"

# Windows: OpenEye ships static-only .lib files in the C++ SDK, and the
# openeye-toolkits Python wheel flattens DLLs into openeye/libs/ rather than
# a platform subdirectory (so FindOpenEyeDLLSDirectory() fails). Static-link
# against the SDK instead; SWIG cross-runtime pointers still interop with
# openeye.oechem at runtime because the OE toolkit versions match.
[[tool.scikit-build.overrides]]
if.platform-system = "win32"
cmake.define.OPENEYE_USE_SHARED = "OFF"

# =============================================================================
# TOML-driven build configuration for scripts/build_python.py
# =============================================================================
# This section is read by build_python.py to parameterize the build.
# The script itself is identical across all projects — only this config changes.
[tool.oe-build]
package-name = "oeio"
cmake-test-flag = "OEIO_BUILD_TESTS"
rpath-strategy = "platform"  # "platform" = @loader_path/../openeye/libs/{platform}, "simple" = @loader_path

# OpenEye libraries that are expected to be missing from delocate
# (they are provided at runtime by openeye-toolkits, not bundled in the wheel)
expected-missing-libs = [
    "liboechem", "liboesystem", "liboeplatform",
    "liboemath", "libzstd",
]

# Additional CMake defines passed during wheel build (beyond the standard ones)
[tool.oe-build.extra-cmake-defines]

[tool.ruff.lint.per-file-ignores]
"python/oeio/__init__.py" = ["E402", "F401"]

# ----------------------------------------------------------------------------------------
# Pyright / Pylance configuration (type checking and editor analysis)
# https://microsoft.github.io/pyright/#/configuration
# ----------------------------------------------------------------------------------------
# Restrict analysis to this project's own source so Pylance does not crawl build
# artifacts, scratch data, vendored trees, or the interpreter's site-packages.
# Combined with the editor's workspace diagnostic mode this checks every project
# file (open or not) while keeping memory bounded.
[tool.pyright]
include = ["python", "tests"]
exclude = [
    "**/__pycache__",
    "**/.*",
    "build",
    "build-*",
    "cmake-build-*",
    "dist",
    "**/*.egg-info",
]
